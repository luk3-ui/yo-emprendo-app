<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yo Emprendo · App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101010;--gris:#6f6f6f;--gris-c:#c4c4c4;--foco:#facc15;--bg:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--ink);background:#e7e5e4;display:flex;gap:28px;align-items:center;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.t-tienda{--f:#c5c4f9;--d:#4846b3;--h:#b4b3f4}
.t-feria{--f:#e9c0c6;--d:#ba1650;--h:#e2adb6}
.t-exito{--f:#bfe3cb;--d:#15803d;--h:#aad6b9}
.t-neutro{--f:#fff;--d:#6f6f6f;--h:#f1f1f1}
.t-teal{--f:#b7e3de;--d:#0a5c55;--h:#a2d6d0}
.t-prodt{--f:#c3d3f6;--d:#1e40af;--h:#b0c4f0}
.t-pedt{--f:#e3c4e8;--d:#701a75;--h:#d8afdf}
.t-blanco{--f:#fff;--d:#0a5c55;--h:#e6f4f2}
.t-peligro{--f:#fbd5d0;--d:#b42318;--h:#f6c0b9}

/* ---------- teléfono ---------- */
#phone{container-type:size;position:relative;width:402px;height:874px;max-height:calc(100vh - 32px);background:var(--bg);border-radius:44px;border:2px solid var(--ink);overflow:hidden;flex:none;box-shadow:none}
#screen{height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:26px 22px 28px 32px;gap:18px}
#screen>*{flex:none}
@media(max-width:520px){html,body{height:100%;height:100dvh;overflow:hidden}body{padding:0;background:var(--bg);align-items:stretch;justify-content:stretch}#phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}#screen{padding-top:calc(26px + env(safe-area-inset-top));padding-bottom:calc(28px + env(safe-area-inset-bottom))}#dev{display:none}}

/* ---------- tipografía ---------- */
h1{font-size:36px;line-height:1.1;font-weight:700}h1:focus,h1:focus-visible{outline:none}
h2{font-size:28px;line-height:1.15;font-weight:700}
.lead{font-size:22px;line-height:1.35}
.body{font-size:20px;line-height:1.4}
.muted{color:#4b4b4b}
.label{font-size:22px;font-weight:700}

/* ---------- botón físico: sombra dura (-10,+10) ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:104px;padding:14px 20px;text-align:center;font-size:32px;font-weight:700;line-height:1.1;
  background:var(--f);border:2px solid var(--d);border-radius:20px;box-shadow:-10px 10px 0 0 var(--d);margin:0 0 10px;transition:transform .08s,box-shadow .08s,background .12s}
.btn:hover{background:var(--h)}
.btn:active,.btn.is-pressed{transform:translate(-10px,10px);box-shadow:none}
.btn[disabled]{background:#ececec;border-color:#a3a3a3;color:#6f6f6f;box-shadow:-10px 10px 0 0 #cfcfcf;cursor:not-allowed}
.btn[disabled]:active{transform:none;box-shadow:-10px 10px 0 0 #cfcfcf}
.btn svg{width:38px;height:38px;flex:none}
/* secundario: blanco + borde, sombra gris clara */
.btn.sec{min-height:88px;font-size:26px;background:#fff;border:2px solid var(--gris);box-shadow:-10px 10px 0 0 var(--gris-c)}
.btn.sec:hover{background:#f4f4f4}
.btn.sec:active{box-shadow:none}
/* chico: Volver / Ayuda */
.btn.sm{width:auto;min-height:60px;padding:8px 18px;font-size:22px;gap:8px;border-radius:16px;box-shadow:-5px 5px 0 0 var(--d);margin:0 5px 5px 0}
.btn.sm:active,.btn.sm.is-pressed{transform:translate(-5px,5px)}
.btn.sm svg{width:26px;height:26px}
.btn.sm.sec{min-height:64px;padding:8px 22px;font-size:20px;font-weight:600;gap:12px;background:#fafaf9;border:1px solid var(--ink);box-shadow:-5px 5px 0 0 var(--gris-c)}
.btn.sm.sec:hover{background:#f1f1f1}
.btn.sm.sec:active,.btn.sm.sec.is-pressed{box-shadow:none}
.btn.sm.sec svg{width:28px;height:28px}
.btn.sec[data-voice]{min-height:76px;padding:8px 32px;font-size:26px;font-weight:700;gap:14px;border-radius:16px;background:#fafaf9;border:1px solid var(--ink);box-shadow:-5px 5px 0 0 var(--gris-c);margin:12px 5px 14px 0;width:calc(100% - 5px)}
.btn.sec[data-voice]:hover{background:#f1f1f1}
.btn.sec[data-voice]:active,.btn.sec[data-voice].is-pressed{transform:translate(-5px,5px);box-shadow:none}
.btn.sec[data-voice] svg{width:34px;height:34px}
.btn.mini{min-height:72px;font-size:24px}


.t-aviso{--f:#ffc93e;--d:#8a5a00}
.etapa{display:block;width:100%;border:1px solid var(--d);border-radius:18px;overflow:hidden;background:#fff;text-align:left}
.etapa .eh{display:block;background:var(--d);color:#fff;padding:12px 16px;font-size:22px;font-weight:700;line-height:1.2}
.etapa .eb{display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px}
.etapa.hecho{--d:#15803d;background:#c1e5cf}
.etapa.cerrada{--d:#6f6f6f;background:#efefef;border-color:#a3a3a3;color:#5a5a5a}
.etapa .ok{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px;color:#15803d}
.etapa .ok svg{width:22px;height:22px}
.etapa .btn{min-height:64px;font-size:24px;box-shadow:none}
.btn[aria-disabled=true]{background:#efefef;color:#6f6f6f;border-color:#a3a3a3;box-shadow:none;cursor:not-allowed}
.pv{display:flex;flex-direction:column;gap:12px;padding:18px;background:#fff;border:1px solid var(--ink);border-radius:18px}
.pv .who{display:flex;gap:16px;align-items:center}
.pv .av{width:64px;height:64px;border-radius:50%;background:#4846b3;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;flex:none}
.pv .nm{display:block;font-size:24px;font-weight:700;line-height:1.2}
.pv .ds{display:block;font-size:18px;color:#6b6b6b;line-height:1.3}
.pv .chip{display:inline-block;align-self:flex-start;padding:10px 18px;border:1px solid #15803d;background:#c1e5cf;border-radius:14px;font-size:22px;font-weight:700}
.pv .pimg{height:96px;border-radius:12px;background:#c3d3f6;display:grid;place-items:center;color:#1e40af}
.pv .pimg svg{width:44px;height:44px}
.frow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;background:#fff;border:1px solid #6f6f6f;border-radius:18px;margin:0 0 4px}
.frow .pl{width:54px;height:54px;flex:none;border-radius:12px;background:var(--d);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700}
.frow .pl svg{width:30px;height:30px}
.frow .ft{display:block;font-size:22px;font-weight:700;line-height:1.2}
.frow .fs{display:block;font-size:16px;font-weight:700;color:#6f6f6f}
.carr{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.tipc{flex:0 0 250px;scroll-snap-align:start;border:1px solid var(--ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;background:#fff;font-size:20px;line-height:1.4}
.tipc b{width:48px;height:44px;border-radius:10px;background:var(--d);color:#fff;display:grid;place-items:center;font-size:24px}
.opt small{display:block;font-weight:400;font-size:18px;color:#4b4b4b;margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bul{list-style:none;display:flex;flex-direction:column;gap:2px;font-size:20px}

.card[style*="pointer-events:none"]{box-shadow:none;margin:0}
.grid2 .card.half{box-shadow:-6px 6px 0 0 var(--sh,var(--d));margin:0 6px 6px 0;width:calc(100% - 6px);min-height:172px;font-size:20px;gap:10px;border-radius:16px;padding:12px}
.grid2 .card.half svg{width:40px;height:40px}
.grid2 .card.half.tall{min-height:172px}
.grid2:has(.card.half){gap:18px 14px}
.grid2 .card.half:active,.grid2 .card.half[aria-disabled=true]{box-shadow:none}
.card small{max-width:300px;font-size:20px;font-weight:400;line-height:1.35}
/* ---------- card con sombra dura ---------- */
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;min-height:236px;padding:18px;text-align:center;font-size:32px;font-weight:700;line-height:1.1;
  background:var(--f);border:1px solid var(--d);border-radius:18px;box-shadow:-10px 10px 0 0 var(--d);margin:0 0 10px;transition:transform .08s,box-shadow .08s,background .12s}
.card:hover{background:var(--h)}
.card:active{transform:translate(-10px,10px);box-shadow:none}
.card svg{width:78px;height:78px}
.card small{display:block;font-size:20px;font-weight:400;margin-top:2px}
.card.half{min-height:178px;font-size:24px;box-shadow:none;gap:8px}
.card.half.t-neutro{--d:var(--ink)}
.card.half svg{width:54px;height:54px}
.card.half:active{transform:none;background:var(--h);border-width:2px}
.card[aria-disabled=true]{background:#ececec;border-color:#a3a3a3;box-shadow:none;color:#6f6f6f}
.card[aria-disabled=true]:active{transform:none;box-shadow:none;background:#ececec;border-width:1px}
.card.tall{min-height:214px}
.up{text-transform:uppercase;font-weight:800;font-size:34px;line-height:1.22;text-align:center}
#screen[data-k=wel] .btn{color:#1f2937}
#screen[data-k=wel] .wtag{font-size:26px;line-height:1.35;letter-spacing:.02em}.regular-wtag{max-width:340px;margin:28px auto 0;font-weight:400;text-transform:none;text-align:center;line-height:1.3}
#screen[data-k=wel] .wlogo svg{width:min(100%,300px);height:auto;animation:wmIn 1.2s cubic-bezier(.4,0,.2,1) both}
.sub30{font-size:30px;line-height:1.4;text-align:center}
.wa{width:96px;height:96px;border-radius:24px;background:#4846b3;color:#fff;display:grid;place-items:center}
.wa svg{width:56px;height:56px}
.sec-t{font-size:24px;font-weight:700;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px 18px}

/* ---------- fila (row card) ---------- */
.row{display:flex;align-items:center;gap:16px;width:100%;padding:16px;background:#fff;border:1px solid var(--ink);border-radius:18px;box-shadow:none;margin:0;transition:background .12s}
.row:hover{background:var(--h)}
.row:active{background:var(--h);border-width:2px}
.row[aria-disabled=true]{background:#f3f3f3;border-color:#bdbdbd;color:#5a5a5a}
.row .ttl{font-size:24px;font-weight:700;line-height:1.15}
.row .sub{font-size:18px;color:#4b4b4b;line-height:1.25}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.iconbox{width:64px;height:64px;flex:none;border-radius:16px;background:var(--d);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700}
.iconbox svg{width:34px;height:34px}
.iconbox.lock{background:#78716c}
.iconbox.soft{background:var(--f);color:var(--ink);border:2px solid var(--d)}

/* ---------- chips / pestañas ---------- */
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{min-height:56px;padding:8px 20px;border-radius:999px;border:1px solid var(--ink);background:#fff;font-size:20px;font-weight:700}
.pill[aria-pressed=true]{background:var(--f);border:2px solid var(--d)}

/* ---------- campos ---------- */
.fld{display:flex;flex-direction:column;gap:8px}
.field{width:100%;min-height:80px;padding:12px 18px;font-size:24px;background:#fff;border:1px solid var(--ink);border-radius:16px}
textarea.field{min-height:150px;resize:none;line-height:1.3}
/* ---- pantallas que deben entrar sin scroll: se adaptan al alto disponible ---- */
#screen[data-k=menu]{gap:clamp(10px,2cqh,18px);padding-top:clamp(14px,3cqh,26px);padding-bottom:clamp(14px,3cqh,28px)}
#screen[data-k=menu] .card{flex:1 1 0;min-height:84px;max-height:236px;margin-bottom:8px;gap:clamp(6px,1.6cqh,14px);font-size:clamp(22px,3.7cqh,32px)}
#screen[data-k=menu] .card svg{width:clamp(36px,8.5cqh,78px);height:clamp(36px,8.5cqh,78px)}
#screen[data-k=menu] h1{font-size:clamp(26px,4.2cqh,36px)}
#screen[data-k=onb]{gap:clamp(6px,1.7cqh,18px);padding-top:clamp(14px,3cqh,26px);padding-bottom:clamp(14px,3cqh,28px)}
#screen[data-k=onb] h1{font-size:clamp(26px,4.2cqh,36px)}
#screen[data-k=onb] .lead{font-size:clamp(17px,2.4cqh,22px)}
#screen[data-k=onb] .label{font-size:clamp(17px,2.4cqh,20px)}
#screen[data-k=onb] .fld{gap:clamp(4px,.9cqh,8px)}
#screen[data-k=onb] .field{min-height:clamp(50px,8.4cqh,80px);padding-top:8px;padding-bottom:8px;font-size:clamp(19px,2.8cqh,24px)}
#screen[data-k=onb] .fld:has(textarea){flex:1 1 auto;min-height:0}
#screen[data-k=onb] #screen[data-k=login]{gap:clamp(8px,2cqh,18px);padding-top:clamp(14px,3cqh,26px);padding-bottom:clamp(14px,3cqh,28px)}
#screen[data-k=login] .wa{width:clamp(56px,11cqh,96px);height:clamp(56px,11cqh,96px);border-radius:clamp(14px,2.8cqh,24px)}
#screen[data-k=login] .wa svg{width:60%;height:60%}
#screen[data-k=login] h1{font-size:clamp(26px,4.2cqh,36px)}
#screen[data-k=login] .field{min-height:clamp(52px,8.4cqh,80px);font-size:clamp(19px,2.8cqh,24px)}
#screen[data-k=login] .label{font-size:clamp(17px,2.4cqh,20px)}
#screen[data-k=login] .lead,#screen[data-k=login] .body{font-size:clamp(17px,2.4cqh,22px)}
#screen[data-k=login]{gap:12px;padding-top:14px;padding-bottom:14px}#screen[data-k=login] .sp{flex:0 0 4px}#screen[data-k=login]>.btn{min-height:88px;font-size:28px}#screen[data-k=login]>.btn.sec.mini{min-height:62px;padding:8px 16px;font-size:22px;margin-bottom:2px}
textarea.field.cmp{flex:1 1 auto;height:auto;min-height:clamp(52px,7.5cqh,92px)}
#screen[data-k=onb] .btn.sec[data-voice]{min-height:76px;margin:2px 5px 4px 0;font-size:clamp(20px,3cqh,26px)}
#screen[data-k=onb]>.btn{min-height:104px;font-size:clamp(24px,3.7cqh,32px);margin-bottom:6px}
textarea.field.cmp{min-height:92px;height:92px}
.fld:has(textarea.cmp) .btn.sec[data-voice]{margin:10px 5px 8px 0}
.field::placeholder{color:#6b6b6b}
.pre{display:flex;align-items:center;gap:0}
.pre b{font-size:28px;padding:0 4px 0 0}
.hint{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:#ffc93e;color:var(--ink);font-size:20px;line-height:1.35}
.hint svg{width:30px;height:30px;flex:none}
.hint.warn,.hint[data-hint]{background:#faadac;border:2px solid #5e1817}
.hidden{display:none!important}

/* ---------- opciones (checkbox/radio) ---------- */
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:80px;padding:12px 16px;background:#fff;border:1px solid var(--ink);border-radius:16px;font-size:22px;font-weight:700;margin:0 0 4px}
.opt .box{width:36px;height:36px;flex:none;border:3px solid var(--ink);border-radius:10px;background:#fff;display:grid;place-items:center}
.opt.radio .box{border-radius:50%}
.opt .box svg{width:24px;height:24px;opacity:0}
.opt[aria-pressed=true]{background:var(--f);border:2px solid var(--d)}
.opt[aria-pressed=true] .box{background:var(--d);border-color:var(--d);color:#fff}
.opt[aria-pressed=true] .box svg{opacity:1}

/* ---------- etiquetas ---------- */
.tag{display:inline-block;width:fit-content;padding:3px 12px;border-radius:999px;font-size:17px;font-weight:700;border:1px solid var(--d);background:var(--f)}
.tag.solid{background:var(--d);color:#fff}
.tag.gray{--d:#6f6f6f;--f:#efefef}
.tag.ok{--d:#15803d;--f:#d7efdf}
.tag.warn{--d:#b45309;--f:#fde8c8}

/* ---------- progreso ---------- */
.prog{display:flex;gap:8px}
.prog i{flex:1;height:14px;border-radius:7px;border:2px solid var(--d);background:#fff}
.prog i.on{background:var(--d)}
.prog i.now{background:var(--f)}
.dots{display:flex;gap:10px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.on{background:var(--ink)}

/* ---------- barra superior ---------- */
.bar{display:flex;justify-content:space-between;align-items:center}

/* ---------- foto ---------- */
.photobox{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:190px;border:3px dashed var(--d);border-radius:20px;background:#fff;font-size:24px;font-weight:700;color:var(--ink)}
.photobox svg{width:56px;height:56px}
.photobox.has{border-style:solid;background:var(--f)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:148px;padding:10px;border:3px dashed var(--gris);border-radius:18px;background:#fff;font-size:20px;font-weight:700;text-align:center;line-height:1.15}
.tile svg{width:42px;height:42px}
.tile.ok{border:2px solid var(--d);border-style:solid;background:var(--f)}
.tile .chk{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--d);color:#fff;display:grid;place-items:center}
.tile .chk svg{width:20px;height:20px}
.tile[aria-pressed=true]{outline:4px solid var(--foco);outline-offset:2px}
.sw{height:148px;border-radius:18px;border:2px solid var(--ink);display:grid;place-items:center}
.sw svg{width:54px;height:54px;opacity:.75}

/* ---------- misc ---------- */
.logo{width:150px;height:150px;border-radius:36px;background:#c5c4f9;border:2px solid #4846b3;box-shadow:-10px 10px 0 #4846b3;display:grid;place-items:center;margin:0 auto}
.logo svg{width:84px;height:84px}
.center{text-align:center}
.bubble{background:#dcf8c6;border:2px solid #4d7c3a;border-radius:18px 18px 4px 18px;padding:14px 16px;font-size:20px;line-height:1.35}
#screen>.sp{flex:1 1 auto}
.spacer{height:4px}
.store-hero{border:2px solid var(--d);background:var(--f);border-radius:18px;padding:18px}
.prod{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--ink);border-radius:16px;background:#fff}
.thumb{width:72px;height:72px;border-radius:14px;background:var(--f);border:2px solid var(--d);display:grid;place-items:center;flex:none}
.thumb svg{width:36px;height:36px}
.qr{display:grid;gap:10px}
.qr code{display:block;padding:10px 12px;background:#fff;border:2px solid var(--gris);border-radius:12px;font-size:16px;word-break:break-all}
.spotl{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .4s}
.spotl.in{opacity:1}
.spotb{position:absolute;top:16px;left:16px;right:16px;z-index:8;display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;background:#ffc93e;color:var(--ink);font-size:22px;line-height:1.35;font-weight:400;
  transform:translateY(calc(-100% - 28px));opacity:0;transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .35s ease}
.spotb.in{transform:none;opacity:1}
.spotb svg{width:32px;height:32px;flex:none;margin-top:3px}
.spotb span{flex:1}
.spotb button{width:52px;height:52px;margin:-8px -8px 0 0;border:0;background:transparent;display:grid;place-items:center;flex:none;color:var(--ink)}
.spotb button svg{width:30px;height:30px;margin:0}
/* animación de tipografía en inicio y bienvenida */
.aw{display:inline-block;opacity:0;transform:translateY(.08em);animation:awIn 1.2s cubic-bezier(.4,0,.2,1) forwards;animation-delay:calc(var(--i)*45ms + 80ms)}
@keyframes awIn{to{opacity:1;transform:none}}
#screen[data-k=splash] .center svg{animation:wmIn 1.2s cubic-bezier(.4,0,.2,1) both}
@keyframes wmIn{from{opacity:0;transform:none}to{opacity:1;transform:none}}

/* tienda: 4 pasos */
const TT = 'tienda';
const TH = ['Cargá el nombre de tu producto.', 'Sumá una foto clara.', 'Poné cuánto cuesta tu producto.', 'Contá cómo es (es opcional).', 'Elegí cómo recibís los pedidos.', 'Dejá tu WhatsApp y abrí tu tienda.'], TN = ['Mis productos', 'Mis fotos', 'Mis precios', 'Mis descripciones', 'Mis pedidos', 'Mis datos de contacto'];
R.tRoute = () => { const n = S.tDone.size; return { html: `${bar()}${hero('Armá tu tienda', n ? `${n} de 6 pasos listos.` : 'Son 6 pasos cortos.')}${prog(Math.min(n + 1, 7), 6, TT, true)}<div class="t-tienda" style="display:flex;flex-direction:column;gap:14px">${TN.map((t, i) => { const k = i + 1, done = S.tDone.has(k), open = k === 1 || S.tDone.has(k - 1) || done; return etapaCard(k, t, done ? 'hecho' : open ? 'ahora' : 'cerrada', open ? TH[i] : CLOSED, 'tStage', k); }).join('')}</div>` }; };
R.t1 = () => ({ html: `${bar()}${prog(1, 6, TT)}${hero('Mis productos', 'Empezá con un producto. Después podés sumar más.')}${field('pname', 'Nombre del producto', { ph: 'Ej: Mini Bag', v: S.draft.name })}<div class="sp"></div>${btn('Seguir', 'tNext', { tone: TT, arg: 1 })}` });

R.t3 = () => ({ html: `${bar()}${prog(3, 6, TT)}${hero('Mis precios', 'Si no sabés el precio exacto, poné uno aproximado.')}${field('pprice', 'Precio', { num: true, pre: true, ph: 'Ej: 4500', v: S.draft.price, voice: true, err: 'Escribí el precio con números.' })}<div class="sp"></div>${btn('Seguir', 'tNext', { tone: TT, arg: 3 })}` });
R.t4 = () => ({ html: `${bar()}${prog(4, 6, TT)}${hero('Mis descripciones', 'Es opcional. Contá cómo es tu producto.')}${field('pdesc', 'Descripción (opcional)', { area: true, ph: 'Ej: Cartera artesanal para acompañarte todos los días.', v: S.draft.desc, err: '' })}<div class="sp"></div>${btn('Seguir', 'tNext', { tone: TT, arg: 4 })}` });
R.t5 = () => ({ html: `${bar()}${prog(5, 6, TT)}${hero('Mis pedidos', '¿Cómo querés recibir los pedidos?')}<div class="t-${TT}">${['Por WhatsApp', 'Retiro en persona', 'Hago envíos'].map(d => opt(d, S.draft.ped.has(d), 'ped:' + d)).join('')}</div><div class="sp"></div>${btn('Seguir', 'tNext', { tone: TT, arg: 5 })}` });
R.t6 = () => ({ html: `${bar()}${prog(6, 6, TT)}${hero('Mis datos de contacto', 'El WhatsApp donde te van a escribir.')}${field('wa', 'WhatsApp para pedidos', { tel: true, ph: 'Ej: 3425551234', v: S.draft.wa || S.phone, voice: false, err: 'Escribí tu número con código de área.' })}<div class="sp"></div>${btn('Abrir mi tienda', 'tNext', { tone: 'exito', arg: 6 })}` });
R.t7 = () => ({ html: `<div class="sp"></div><div class="card t-exito" style="pointer-events:none;min-height:420px">${ic('bag')}¡Tu tienda está abierta!<small>Ya la pueden ver tus clientes. Podés compartirla cuando quieras.</small></div><div class="sp"></div>${btn('Compartir mi tienda', 'toShare', { tone: TT })}${btn('Ver mi tienda', 'toShop', { sec: true })}`, transient: true });
const slug = () => (S.shop || 'mi-tienda').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* panel de la tienda: va ANTES de los pasos */
R.dash = () => { const op = S.open, dis = op ? '' : 'aria-disabled="true"';
  const SH = { tienda: '#4846b3', prodt: '#1e40af', pedt: '#701a75' };
  const tile = (tone, icon, label, act, sh) => `<button type="button" class="card half tall t-${tone}" ${sh ? `style="--sh:${SH[sh]}"` : ''} data-act="${op ? act : 'locked'}" ${dis}>${ic(op ? icon : 'lock')}${label}</button>`;
  const first = S.tDone.size === 0;
  const top = op ? `<span class="tag ok">Tienda abierta</span>` : `<div class="hint t-tienda">${ic('info')}<span>Primero armá tu tienda. Son 6 pasos cortos.</span></div>${btn(first ? 'Armar mi tienda' : `Seguir con mi tienda · ${S.tDone.size} de 6`, 'toSteps', { tone: 'tienda', icon: 'bag' })}`;
  return { html: `${bar()}<h1 tabindex="-1">Mi tienda</h1>${top}
  <p class="sec-t">Tienda</p><div class="grid2">${tile('tienda', 'eye', 'Ver tienda', 'toShop', 'tienda')}${tile('neutro', 'share', 'Compartir tienda', 'toShare', 'tienda')}</div>
  <p class="sec-t">Productos</p><div class="grid2">${tile('prodt', 'box', 'Cargar producto', 'newProd', 'prodt')}${tile('neutro', 'list', 'Ver mis productos', 'toProds', 'prodt')}</div>
  <p class="sec-t">Pedidos</p><div class="grid2">${tile('pedt', 'receipt', 'Ver mis pedidos', 'toOrders', 'pedt')}${tile('neutro', 'phone', 'Contactar cliente', 'toClientes', 'pedt')}</div>`, kind: 'dash' }; };

const qrSVG = () => { const n = 21, cells = []; const finder = (x, y, ox, oy) => { const dx=x-ox, dy=y-oy; return dx>=0&&dx<7&&dy>=0&&dy<7&&(dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4)); }; for(let y=0;y<n;y++) for(let x=0;x<n;x++){ const reserved=[[0,0],[14,0],[0,14]].some(([a,b])=>x>=a-1&&x<a+8&&y>=b-1&&y<b+8); const f=finder(x,y,0,0)||finder(x,y,14,0)||finder(x,y,0,14); if(f||(!reserved&&((x*17+y*31+x*y*7)%11<5))) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`); } return `<svg class="qr-svg" viewBox="-1 -1 23 23" role="img" aria-label="Código QR decorativo">${cells.join('')}</svg>`; };

function showInfoBanner(text) { closeHelp(); infoTrigger=document.activeElement; const overlay=document.createElement('div'); overlay.className='info-overlay'; overlay.setAttribute('role','presentation'); overlay.innerHTML=`<section class="info-banner" role="dialog" aria-modal="true" aria-labelledby="info-message"><div class="info-message">${ic('info')}<p id="info-message">${text}</p><button type="button" class="info-close" data-act="closeInfoBanner" aria-label="Cerrar aviso">${ic('x')}</button></div><button type="button" class="btn info-ok" data-act="closeInfoBanner">Entendido</button></section>`; phone.appendChild(overlay); overlay.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.preventDefault(); closeInfoBanner(); return; } if(e.key==='Tab'){ const items=$$('button:not([disabled])',overlay), first=items[0], last=items[items.length-1]; if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();} else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();} } }); requestAnimationFrame(()=>overlay.classList.add('in')); $('.info-ok',overlay).focus(); }
function closeInfoBanner() { const overlay=$('.info-overlay',phone); if(overlay){ overlay.classList.remove('in'); setTimeout(()=>{overlay.remove(); if(infoTrigger&&infoTrigger.isConnected)infoTrigger.focus(); infoTrigger=null; },220); } }

    if (k === 'ped') { if (S.draft.ped.has(v)) S.draft.ped.delete(v); else S.draft.ped.add(v); render('t5'); return; }
  }
  if ((el = t.closest('[data-act]'))) { const a = el.dataset.act; if (ACT[a]) ACT[a](el.dataset.arg || '', el); }
});
phone.addEventListener('input', e => { if (e.target.matches('[inputmode="numeric"]')) e.target.value = digits(e.target.value); const h = $(`[data-hint="${e.target.id}"]`, screen); if (h) h.classList.add('hidden'); });

/* ---------- panel / arranque ---------- */
const jump = $('#jump');
jump.innerHTML = Object.keys(R).map(k => `<option value="${k}">${NAMES[k] || k}</option>`).join('');
jump.addEventListener('change', () => { if (cur === 'pedit' || jump.value === 'pedit') { S.editing = 'new'; S.pdraft = S.pdraft || { name: '', price: '', desc: '', photo: false }; } if (jump.value === 'fair') S.fair = 1; H = [['menu', null]]; render(jump.value, jump.value === 'wel' ? 1 : null); });
$('#restart').addEventListener('click', () => { reset(); S.phone = '3425551234'; H = []; cur = null; render('menu'); });

const query = new URLSearchParams(location.search);
/* Accesos fijos para QR (no cambiar estos nombres: están impresos):
   ?paso=tienda  → pasos de Mi Tienda Digital
   ?paso=feria   → pasos de la carpeta para Postularme a una feria (igual que ?paso=carpeta)
   ?ver=tienda   → Ver tienda (vitrina con los productos)
   También funcionan como #tienda, #feria y #ver-tienda. */
const hs = decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase();
let paso = (query.get('paso') || (/^(tienda|carpeta|feria)(-\d+)?$/.test(hs) ? hs : '')).toLowerCase() || null;
if (paso) paso = paso.replace(/^feria/, 'carpeta');
const ver = (query.get('ver') || (hs === 'ver-tienda' ? 'tienda' : '')).toLowerCase() || null;
let start = ['menu'];
S.phone = '3425551234';
let directScreen = null;
if (paso) {
  const m = paso.match(/^(carpeta|tienda)(?:-(\d+))?$/);
  S.phone = '3425551234'; S.shop = 'Mora'; S.desc = 'Carteras, bolsos y accesorios hechos para acompañarte todos los días.'; S.intro = true;
  if (m && m[1] === 'tienda') {
    const n = Math.min(+m[2] || 0, 7);
    for (let i = 1; i < n && i <= 6; i++) S.tDone.add(i);
    if (n === 7) { S.open = true; S.tDone.add(6); }
    directScreen = n ? 't' + n : 'tRoute';
    if (n >= 2) S.draft.name = 'Mini Bag';
    if (n >= 3) S.draft.photo = true;
    if (n >= 4) S.draft.price = 4500;
    if (n >= 5) S.draft.desc = 'Cartera mini de cuero, hecha a mano y pensada para llevar lo esencial.';
    if (n >= 6) S.draft.wa = S.phone;
  } else if (m) {
    const n = Math.min(+m[2] || 0, 8);
    for (let i = 1; i < n && i <= 7; i++) S.cDone.add(i);
    directScreen = n ? 'c' + n : 'cRoute';
  } else if (paso === 'links') directScreen = 'links';
  else if (paso === 'panel') directScreen = 'dash';
}
if (ver === 'tienda') {
  S.phone = '3425551234'; S.shop = 'Mora'; S.desc = 'Carteras, bolsos y accesorios hechos para acompañarte todos los días.';
  directScreen = 'shop';
}
window.addEventListener('hashchange', () => { if (/^#(tienda|carpeta|feria)(-\d+)?$|^#ver-tienda$/i.test(location.hash)) location.reload(); });
if (directScreen) home(directScreen);
else render(...start);
})();
</script>
</body>
</html>
